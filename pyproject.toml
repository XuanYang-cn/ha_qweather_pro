[project]
name = "ha-qweather-pro-fork-tests"
version = "0.0.0"
requires-python = ">=3.14.2"

[dependency-groups]
test = [
  "homeassistant @ https://github.com/home-assistant/core/archive/refs/tags/2026.7.2.tar.gz",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-socket>=0.8,<1",
  "ruff>=0.15,<1",
  "tenacity>=9.1.4,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
