name: Auto Release Draft (Strict Version Check)

on:
  push:
    tags: ["v*-yx.*"]

permissions:
  contents: write

jobs:
  build-and-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须获取所有历史和标签

      - name: Verify release tag matches the manifest
        id: check
        run: |
          # 1. 自动定位集成目录和 manifest 文件
          MANIFEST_FILE=$(ls custom_components/*/manifest.json | head -n 1)
          COMPONENT_NAME=$(basename $(dirname $MANIFEST_FILE))
          NEW_VERSION=$(python3 -c "import json; print(json.load(open('$MANIFEST_FILE'))['version'])")
          
          if [ "v$NEW_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $NEW_VERSION" >&2
            exit 1
          fi
          BASE_VERSION=${NEW_VERSION%-yx.*}
          MAINTENANCE_BRANCH="maint/v${BASE_VERSION}-yx"
          git fetch origin "$MAINTENANCE_BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$MAINTENANCE_BRANCH")" ]; then
            echo "Tag must point at the current $MAINTENANCE_BRANCH head" >&2
            exit 1
          fi
          echo "compare_result=success" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "comp_name=$COMPONENT_NAME" >> $GITHUB_OUTPUT
          echo "commit_title=$(git log -1 --pretty=format:'%s')" >> $GITHUB_OUTPUT
          echo "is_prerelease=false" >> $GITHUB_OUTPUT

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Validate the exact tagged release commit
        run: |
          uv sync --frozen --group test
          uv run python -m compileall -q custom_components/qweather_pro
          uv run ruff check custom_components/qweather_pro/clients.py custom_components/qweather_pro/location.py tests
          uv run pytest

      - name: Create ZIP file
        if: steps.check.outputs.compare_result == 'success'
        run: |
          cd custom_components/${{ steps.check.outputs.comp_name }}
          zip -r ../../${{ steps.check.outputs.comp_name }}.zip .

      - name: Create GitHub Release
        if: steps.check.outputs.compare_result == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.check.outputs.version }}
          # 按照你的习惯：v1.0.0 - 标题内容
          name: v${{ steps.check.outputs.version }} - ${{ steps.check.outputs.commit_title }}
          files: |
            ${{ steps.check.outputs.comp_name }}.zip
          draft: false
          prerelease: ${{ steps.check.outputs.is_prerelease }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
